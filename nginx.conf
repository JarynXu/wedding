server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.ics$ {
        types {
            text/calendar ics;
        }
        add_header Content-Disposition 'inline; filename="wedding.ics"';
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
