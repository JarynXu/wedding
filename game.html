<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>默契挑战 · 婚礼之约</title>
  <link rel="icon" type="image/svg+xml" href="./src/assets/invitation-mark.svg">
  <style>html{background:#31221c;color:#f8e4c1}body{margin:0}#gameApp{max-width:450px;margin:auto;padding:26px 20px}</style>
</head>
<body>
  <main id="gameApp" data-state="loading">
    <header class="game-page-header"><small>A LITTLE WEDDING CHALLENGE</small><h1>默契挑战</h1><p>六道小问答，看看你有多了解这对新人</p></header>
    <div class="game-paper">
      <nav class="game-tabs" role="tablist" aria-label="默契挑战"><button type="button" role="tab" data-game-tab="play" aria-selected="true">我的默契</button><button type="button" role="tab" data-game-tab="board" aria-selected="false" tabindex="-1">默契榜</button></nav>
      <div id="gameContent"><p class="game-empty">正在展开默契小笺…</p></div>
      <p id="gameFeedback" role="status" aria-live="polite"></p>
    </div>
    <a id="backToInvitation" class="game-back" href="./">返回请柬</a>
  </main>
  <script type="module" src="./src/game/main.js"></script>
</body>
</html>
