<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>默契挑战 · 婚礼之约</title>
  <link rel="icon" type="image/svg+xml" href="./src/assets/invitation-mark.svg">
  <style>html{background:#31221c;color:#f8e4c1}body{margin:0}#gameApp{max-width:450px;margin:auto;padding:26px 20px}</style>
</head>
<body>
  <main id="gameApp" data-state="loading">
    <div class="game-paper glass-surface">
    <nav class="game-toolbar" aria-label="默契挑战导航">
      <a id="backToInvitation" class="game-back-link" href="./" aria-label="返回请柬"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></a>
      <span id="gameBoardHeading" class="game-header-state"><span id="gameViewTitle">喜宴司仪</span></span>
      <div class="game-menu-wrap">
        <button type="button" id="gameMenuToggle" class="game-menu-button" aria-label="更多选项" aria-expanded="false" aria-controls="gameMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M9 12h10M5 17h14"/></svg></button>
        <div id="gameMenu" class="game-menu glass-surface" hidden><button type="button" data-game-tab="board">默契榜</button><button type="button" id="showGameRules">游戏规则</button><button type="button" id="gameLogout" hidden>退出登录</button></div>
      </div>
    </nav>
      <div id="gameContent"><p class="game-empty">喜宴司仪正在准备开场…</p></div>
    </div>
  </main>
  <script type="module" src="./src/game/main.js"></script>
</body>
</html>
